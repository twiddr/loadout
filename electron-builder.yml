# `pnpm package`: electron-vite build, electron-builder --mac --dir -> dist/mac-arm64/Loadout.app,
# ad-hoc codesign, then electron-builder --mac dmg --prepackaged -> dist/Loadout.dmg.
appId: com.twiddr.loadout
productName: Loadout
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
mac:
  icon: design/icon.icns
  target:
    - target: dir
      arch: arm64
  category: public.app-category.developer-tools
  identity: null
dmg:
  artifactName: Loadout.dmg
  title: "${productName} ${version}"

<!doctype html>
<!-- Source of build/background.png and build/background@2x.png, the DMG window background (540 x 380).
     Render: design/dmg/render.sh. Finder places the icons at x 130 and x 410, y 220 (dmg-builder defaults). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Black Ops One';
    src: url('../../node_modules/@fontsource/black-ops-one/files/black-ops-one-latin-400-normal.woff2') format('woff2');
  }
  html, body { margin: 0; width: 540px; height: 380px; overflow: hidden; }
  body {
    position: relative;
    background-color: #2a2a2a;
    background-image:
      linear-gradient(#2e2e2e 1px, transparent 1px),
      linear-gradient(90deg, #2e2e2e 1px, transparent 1px);
    background-size: 32px 32px;
  }
  h1 {
    position: absolute; top: 58px; left: 0; right: 0; margin: 0;
    text-align: center;
    font: 400 52px/1 'Black Ops One', sans-serif;
    letter-spacing: 0.04em;
    color: #e8dfc4;
  }
  svg { position: absolute; left: 240px; top: 188px; }
  /* Finder draws the icon labels black on a background picture, whatever the system appearance,
     so each label sits on a cream plate. Label centres: x 130 and x 410, y 275. */
  .plate {
    position: absolute; top: 265px; width: 96px; height: 20px; margin-left: -48px;
    border-radius: 10px; background: #e8dfc4;
  }
</style>
</head>
<body>
  <h1>LOADOUT</h1>
  <!-- Dashed outline arrow from the app to Applications, in the app's accent colour. -->
  <svg width="60" height="64" viewBox="0 0 60 64" fill="none" stroke="#e9a04b" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round">
    <path d="M5 20 H30 V5 L55 32 L30 59 V44 H5 Z" />
  </svg>
  <div class="plate" style="left: 130px"></div>
  <div class="plate" style="left: 410px"></div>
</body>
</html>
